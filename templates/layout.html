<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestãoLead PRO</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#1E293B',
                        dark: '#0F172A'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .sidebar-link:hover, .sidebar-link.active { background-color: rgba(59, 130, 246, 0.1); color: #3B82F6; border-right: 3px solid #3B82F6; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #E2E8F0; }
        
        /* Loading Spinner */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3B82F6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar Estilo IA (Gemini / Moderno) -->
    <aside id="sidebar" class="w-64 bg-[#F0F4F9] border-r border-transparent flex flex-col h-screen transition-all duration-300 z-10 shrink-0 overflow-hidden">
        <!-- Logo -->
        <div class="p-4 pl-6 flex items-center mt-2 mb-2 w-64">
            <span class="text-xl font-semibold text-[#444746] tracking-tight flex items-center whitespace-nowrap">
                <i class="fa-solid fa-bolt text-blue-600 mr-2"></i> GestãoLead
            </span>
        </div>
        
        <!-- Botão Principal Estilo "Novo Chat" -->
        <div class="px-3 mb-6 mt-2 w-64">
            <a href="/" class="flex items-center gap-3 bg-white hover:bg-slate-50 shadow-sm border border-slate-200 text-[#444746] text-sm font-medium py-3 px-4 rounded-2xl transition-all group whitespace-nowrap">
                <i class="fa-solid fa-plus text-blue-500 group-hover:rotate-90 transition-transform duration-300"></i>
                <span>Nova Prospecção</span>
            </a>
        </div>
        
        <!-- Links de Navegação -->
        <nav class="flex-1 flex flex-col gap-1 px-3 w-64">
            <div class="px-4 py-2 mt-2 mb-1">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Gestão</span>
            </div>
            
            <a href="/crm" class="flex items-center gap-3 py-2.5 px-4 rounded-full text-sm font-medium transition-colors whitespace-nowrap {% if active_page == 'crm' %}bg-[#D3E3FD] text-[#041E49]{% else %}text-[#444746] hover:bg-[#E1E5EA]{% endif %}">
                <i class="fa-solid fa-database w-5 text-center"></i> 
                Base do CRM
            </a>
            
            <!-- Módulo de Estatísticas do SaaS -->
            <a href="/estatisticas" class="flex items-center gap-3 py-2.5 px-4 rounded-full text-sm font-medium transition-colors whitespace-nowrap {% if active_page == 'estatisticas' %}bg-[#D3E3FD] text-[#041E49]{% else %}text-[#444746] hover:bg-[#E1E5EA]{% endif %}">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i> 
                Estatísticas
            </a>
        </nav>
        
        <!-- Sessão Inferior -->
        <div class="p-3 mb-2 flex flex-col gap-1 w-64">
            <a href="/configuracoes" class="flex items-center gap-3 py-2.5 px-4 rounded-full text-sm font-medium transition-colors whitespace-nowrap {% if active_page == 'configuracoes' %}bg-[#D3E3FD] text-[#041E49]{% else %}text-[#444746] hover:bg-[#E1E5EA]{% endif %}">
                <i class="fa-solid fa-gear w-5 text-center"></i>
                Configurações
            </a>
            <div class="py-2.5 px-4 text-xs text-[#444746] opacity-60 text-center whitespace-nowrap">
                &copy; 2026 SaaS Edition
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-white relative">
        <!-- Headerbar -->
        <header class="h-16 bg-white flex items-center px-6">
            <button onclick="toggleSidebar()" class="mr-4 text-[#444746] hover:bg-[#F0F4F9] p-2 rounded-full transition-colors focus:outline-none" title="Ocultar/Mostrar Menu">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <h2 class="text-2xl font-semibold text-[#1F1F1F] flex-1">{% block header_title %}{% endblock %}</h2>
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm border border-blue-200">
                    PL
                </div>
            </div>
        </header>

        <!-- Content Padding -->
        <div class="p-8 flex-1 max-w-7xl mx-auto w-full">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('w-64')) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-0');
            } else {
                sidebar.classList.remove('w-0');
                sidebar.classList.add('w-64');
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
