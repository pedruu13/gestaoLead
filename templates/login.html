<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar &bull; GestãoLead PRO</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090D14;
        }
        .bg-subtle-grid {
            background-size: 28px 28px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-subtle-grid text-slate-100 antialiased">

    <!-- Iluminação sutil e sóbria de fundo (sem néon roxo) -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[350px] bg-emerald-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo e Cabeçalho Superior Sóbrio -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-slate-900 border border-slate-700/80 shadow-xl shadow-black/50 mb-4">
                <i class="fa-solid fa-crosshairs text-2xl text-emerald-400"></i>
            </div>
            <h1 class="text-3xl font-black tracking-tight text-white flex items-center justify-center gap-1.5">
                Gestão<span class="text-emerald-400">Lead</span>
                <span class="text-[10px] tracking-wider uppercase font-black bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-md">PRO</span>
            </h1>
            <p class="text-slate-400 text-sm mt-2 font-medium">Terminal Comercial & Prospecção Ativa</p>
        </div>

        <!-- Card de Login Corporativo -->
        <div class="bg-slate-900/95 border border-slate-800 rounded-2xl p-7 md:p-8 shadow-2xl shadow-black">
            
            {% if erro %}
            <div class="mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/25 text-rose-300 flex items-start gap-3 text-sm">
                <i class="fa-solid fa-circle-exclamation text-rose-400 text-base mt-0.5 shrink-0"></i>
                <div>
                    <span class="font-bold block">Erro de autenticação</span>
                    <span>{{ erro }}</span>
                </div>
            </div>
            {% endif %}

            <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        Usuário
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <input type="text" id="username" name="username" required autofocus autocomplete="username"
                            placeholder="Digite seu usuário"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-white placeholder-slate-600 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none transition-all">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-400">
                            Senha
                        </label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            placeholder="••••••••••••"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-11 py-3 text-white placeholder-slate-600 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none transition-all">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition-colors focus:outline-none" title="Exibir/Ocultar senha">
                            <i id="eye-icon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" name="remember" checked
                            class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-emerald-500 cursor-pointer">
                        <span class="text-xs font-medium text-slate-400">Lembrar neste navegador (60 dias)</span>
                    </label>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full mt-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/30 transition-all flex items-center justify-center gap-2 text-sm tracking-wide">
                    <i class="fa-solid fa-arrow-right-to-bracket text-base"></i>
                    <span>ENTRAR NO SISTEMA</span>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-800/80 flex items-center justify-center gap-2 text-xs text-slate-400">
                <i class="fa-solid fa-shield-check text-emerald-400"></i>
                <span>Ambiente Seguro &bull; Sessão Ativa</span>
            </div>
        </div>

        <!-- Rodapé externo -->
        <p class="text-center text-xs text-slate-400 mt-6 font-medium">
            GestãoLead PRO &bull; Inteligência Comercial B2B
        </p>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        const form = document.querySelector('form');
        const btn = document.getElementById('submit-btn');
        form.addEventListener('submit', () => {
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-base"></i><span>Autenticando...</span>';
        });
    </script>
</body>
</html>
