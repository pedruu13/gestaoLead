<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar &bull; GestãoLead PRO</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: '#4F46E5',
                        brand: {
                            50: '#EEF2FF',
                            100: '#E0E7FF',
                            500: '#6366F1',
                            600: '#4F46E5',
                            700: '#4338CA',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
        }
        .bg-grid {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-grid text-slate-100 antialiased">

    <!-- Efeitos de iluminação de fundo / Neon Aura -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/25 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-500/10 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo e Cabeçalho Superior -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-sky-400 p-[1px] shadow-2xl shadow-indigo-500/30 mb-4 ring-1 ring-white/20">
                <div class="w-full h-full bg-slate-950/80 backdrop-blur-xl rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-bolt text-2xl text-amber-400"></i>
                </div>
            </div>
            <h1 class="text-3xl font-black tracking-tight text-white flex items-center justify-center gap-1.5">
                Gestão<span class="text-indigo-400">Lead</span>
                <span class="text-[10px] tracking-wider uppercase font-black bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 px-2 py-0.5 rounded-full">PRO</span>
            </h1>
            <p class="text-slate-400 text-sm mt-2 font-medium">Plataforma de Prospecção & CRM de Vendas</p>
        </div>

        <!-- Card de Login -->
        <div class="bg-slate-900/90 backdrop-blur-2xl border border-white/10 rounded-3xl p-7 md:p-8 shadow-2xl shadow-black/80">
            
            {% if erro %}
            <div class="mb-6 p-4 rounded-2xl bg-rose-500/10 border border-rose-500/25 text-rose-300 flex items-start gap-3 text-sm animate-pulse">
                <i class="fa-solid fa-circle-exclamation text-rose-400 text-base mt-0.5 shrink-0"></i>
                <div>
                    <span class="font-bold block">Falha no acesso</span>
                    <span>{{ erro }}</span>
                </div>
            </div>
            {% endif %}

            <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                        Usuário
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <input type="text" id="username" name="username" required autofocus autocomplete="username"
                            placeholder="Digite seu usuário"
                            class="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-white placeholder-slate-500 text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none transition-all">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                            Senha
                        </label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            placeholder="••••••••••••"
                            class="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl pl-11 pr-11 py-3 text-white placeholder-slate-500 text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none transition-all">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-300 transition-colors focus:outline-none" title="Exibir/Ocultar senha">
                            <i id="eye-icon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" name="remember" checked
                            class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                        <span class="text-xs font-semibold text-slate-400">Manter conectado (60 dias)</span>
                    </label>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full mt-2 bg-gradient-to-r from-indigo-500 via-indigo-600 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-arrow-right-to-bracket text-base"></i>
                    <span>Entrar no Sistema</span>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-white/5 flex items-center justify-center gap-2 text-xs text-slate-400">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                <span>Acesso seguro com criptografia de ponta a ponta</span>
            </div>
        </div>

        <!-- Rodapé externo -->
        <p class="text-center text-xs text-slate-400 mt-6 font-medium">
            GestãoLead PRO &copy; 2026 &bull; Todos os direitos reservados
        </p>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Feedback de carregamento ao submeter o formulário
        const form = document.querySelector('form');
        const btn = document.getElementById('submit-btn');
        form.addEventListener('submit', () => {
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-base"></i><span>Autenticando...</span>';
        });
    </script>
</body>
</html>
