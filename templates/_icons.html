{% macro icon(name, classes='') -%}
<svg class="lucide {{ classes }}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == 'x' %}<path d="M18 6 6 18M6 6l12 12"/>
    {% elif name == 'crosshair' %}<circle cx="12" cy="12" r="10"/><path d="M22 12h-4M6 12H2M12 6V2M12 22v-4"/>
    {% elif name == 'scan-search' %}<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="11" cy="11" r="3"/><path d="m16 16-2.1-2.1"/>
    {% elif name == 'send' %}<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
    {% elif name == 'messages' %}<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/><path d="M8 9h8M8 13h5"/>
    {% elif name == 'ban' %}<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>
    {% elif name == 'chart' %}<path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/>
    {% elif name == 'sliders' %}<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>
    {% elif name == 'log-out' %}<path d="M10 17l5-5-5-5M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
    {% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
    {% elif name == 'chevron-down' %}<path d="m6 9 6 6 6-6"/>
    {% elif name == 'shield-check' %}<path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3Z"/><path d="m9 12 2 2 4-4"/>
    {% elif name == 'user' %}<path d="M19 21a7 7 0 0 0-14 0"/><circle cx="12" cy="7" r="4"/>
    {% elif name == 'lock' %}<rect width="16" height="12" x="4" y="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    {% elif name == 'eye' %}<path d="M2.1 12a10 10 0 0 1 19.8 0 10 10 0 0 1-19.8 0"/><circle cx="12" cy="12" r="3"/>
    {% elif name == 'eye-off' %}<path d="m2 2 20 20M10.6 10.7a2 2 0 0 0 2.7 2.7M9.9 4.2A10.5 10.5 0 0 1 12 4c7 0 10 8 10 8a16 16 0 0 1-2.1 3.2M6.6 6.7C3.9 8.5 2 12 2 12s3 8 10 8a9.7 9.7 0 0 0 4.2-.9"/>
    {% elif name == 'log-in' %}<path d="M10 17l5-5-5-5M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
    {% elif name == 'alert' %}<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
    {% elif name == 'check-circle' %}<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
    {% endif %}
</svg>
{%- endmacro %}
